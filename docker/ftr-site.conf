<VirtualHost *:8080>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Internal state and writable data must not be served.
    <DirectoryMatch "^/var/www/html/(cache|site_config|admin/.*\.txt)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
