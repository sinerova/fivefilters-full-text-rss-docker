ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    ServerName localhost
    UseCanonicalName On
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Internal state, bundled PHP libraries, and writable data must not be served.
    <DirectoryMatch "^/var/www/html/(cache|site_config|libraries)(/|$)">
        Require all denied
    </DirectoryMatch>

    <LocationMatch "^/(cache|site_config|libraries)(/|$)">
        Require all denied
    </LocationMatch>

    # Block direct HTTP access to internal config/include scripts, maintenance helpers,
    # legacy provisioning manifests, and version-disclosing documentation files.
    <LocationMatch "^/(cleancache\.php|config\.php|custom_config\.php|custom_init\.php|ubuntu-16\.04\.pp|changelog\.txt|UPDATING\.txt|README\.(txt|md)|admin/(require_login|template|session_csrf)\.php|admin/.*\.txt)$">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
